name: ORIN daily digest

on:
  workflow_dispatch:
  schedule:
    # 07:17 Pacific daylight time / 06:17 Pacific standard time.
    - cron: '17 14 * * *'

permissions:
  contents: read

concurrency:
  group: orin-daily-digest
  cancel-in-progress: false

jobs:
  digest:
    if: github.event_name == 'workflow_dispatch' || vars.ORIN_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ORIN_INGEST_URL: ${{ secrets.ORIN_INGEST_URL }}
      ORIN_INGEST_TOKEN: ${{ secrets.ORIN_INGEST_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      ORIN_BROWSER_STORAGE_STATE: ${{ secrets.ORIN_BROWSER_STORAGE_STATE }}
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      REDDIT_USERNAME: ${{ vars.REDDIT_USERNAME }}
      X_API_BEARER_TOKEN: ${{ secrets.X_API_BEARER_TOKEN }}
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      ORIN_CONFIG: ${{ vars.ORIN_CONFIG }}
    steps:
      - name: Check configuration
        id: ready
        shell: bash
        run: |
          if [[ -z "$ORIN_INGEST_URL" || -z "$ORIN_INGEST_TOKEN" || -z "$OPENROUTER_API_KEY" ]]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'ORIN skipped: configure ingest URL/token and OpenRouter repository secrets first.'
          else
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.ready.outputs.ready == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: steps.ready.outputs.ready == 'true'
        with:
          node-version: '22'
      - name: Install isolated worker dependencies
        if: steps.ready.outputs.ready == 'true'
        run: npm ci --workspace=@portfolio/orin-collector --ignore-scripts
      - name: Install Chromium
        if: steps.ready.outputs.ready == 'true' && env.ORIN_BROWSER_STORAGE_STATE != ''
        run: npm exec --workspace=@portfolio/orin-collector -- playwright install --with-deps chromium
      - name: Prepare source configuration
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          umask 077
          if [[ -n "$ORIN_CONFIG" ]]; then
            printf '%s' "$ORIN_CONFIG" > apps/orin-collector/config.local.json
          else
            cp apps/orin-collector/config.example.json apps/orin-collector/config.local.json
          fi
      - name: Set Pacific cap date
        if: env.X_API_BEARER_TOKEN != ''
        id: x-cap-date
        run: echo "date=$(TZ=America/Los_Angeles date +%F)" >> "$GITHUB_OUTPUT"
      - name: Restore X daily cap marker
        if: env.X_API_BEARER_TOKEN != ''
        id: x-cap
        uses: actions/cache/restore@v4
        with:
          path: .orin-x-cap
          key: orin-x-cap-${{ steps.x-cap-date.outputs.date }}
      - name: Reserve X daily cap
        if: env.X_API_BEARER_TOKEN != '' && steps.x-cap.outputs.cache-hit != 'true'
        run: mkdir -p .orin-x-cap && date -u +%FT%TZ > .orin-x-cap/reserved
      - name: Save X daily cap marker
        if: env.X_API_BEARER_TOKEN != '' && steps.x-cap.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .orin-x-cap
          key: orin-x-cap-${{ steps.x-cap-date.outputs.date }}
      - name: Collect, group and publish
        if: steps.ready.outputs.ready == 'true'
        env:
          ORIN_X_API_ALREADY_USED: ${{ steps.x-cap.outputs.cache-hit == 'true' }}
        run: npm run collect --workspace=@portfolio/orin-collector -- --once
      # No profile, digest, credential or browser-state caches/artifacts are uploaded.
